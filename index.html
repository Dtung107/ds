    <!-- Sandbox iframe environment polyfill for Pyodide & localStorage safety -->
    <script>
      (function() {
        function createMemoryStore() {
          var store = {};
          return {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }

        // Test and polyfill localStorage
        try {
          var testK = '__storage_test__';
          window.localStorage.setItem(testK, testK);
          window.localStorage.removeItem(testK);
        } catch (_) {
          try {
            var memLocal = createMemoryStore();
            Object.defineProperty(window, 'localStorage', { value: memLocal, writable: true, configurable: true });
          } catch (e2) {}
        }

        // Test and polyfill sessionStorage
        try {
          var testS = '__session_test__';
          window.sessionStorage.setItem(testS, testS);
          window.sessionStorage.removeItem(testS);
        } catch (_) {
          try {
            var memSession = createMemoryStore();
            Object.defineProperty(window, 'sessionStorage', { value: memSession, writable: true, configurable: true });
          } catch (e3) {}
        }
      })();
    </script>
