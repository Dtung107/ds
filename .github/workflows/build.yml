name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BƯỚC QUAN TRỌNG: Cài đặt và kích hoạt Python 3.11 làm mặc định cho hệ thống
      - name: Thiet lap Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          update-environment-path: true

      - name: Cai dat phu thuoc he thong
        run: |
          sudo apt update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgdbm-dev libsqlite3-dev tk-dev libb2-dev liblzma-dev libreadline-dev uuid-dev
          
          # Ép pip sử dụng Python 3.11 vừa cài đặt để cài Cython và Buildozer
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0.0" virtualenv buildozer

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Tien hanh Build APK bang Buildozer
        run: |
          # Chạy Buildozer thông qua môi trường Python 3.11
          yes | python3 -m buildozer android debug

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Quay-So-Moi-Nhat
          path: bin/*.apk
