name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiet lap Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          update-environment-path: true

      # Ép Buildozer nhận diện đúng lệnh python3.11 làm hostpython
      - name: Thiet lap bien moi truong Python
        run: |
          echo "FOO=bar" >> $GITHUB_ENV
          sudo ln -sf /opt/hostedtoolcache/Python/3.11.*/x64/bin/python3 /usr/local/bin/python3
          sudo ln -sf /opt/hostedtoolcache/Python/3.11.*/x64/bin/python3 /usr/bin/python3

      - name: Cai dat phu thuoc he thong
        run: |
          sudo apt update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgdbm-dev libsqlite3-dev tk-dev libb2-dev liblzma-dev libreadline-dev uuid-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0.0" virtualenv buildozer

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Tien hanh Build APK bang Buildozer
        run: |
          yes | python3 -m buildozer android debug
        env:
          # Ép buildozer sử dụng đúng file thực thi python3.11
          PATH: /opt/hostedtoolcache/Python/3.11.11/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Quay-So-Moi-Nhat
          path: bin/*.apk
