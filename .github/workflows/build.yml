name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ÉP TOÀN BỘ MÁY CHỦ SỬ DỤNG PYTHON 3.10
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          update-environment-path: true

      - name: Cai dat phu thuoc he thong
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgdbm-dev libsqlite3-dev tk-dev libb2-dev liblzma-dev libreadline-dev uuid-dev

      - name: Cai dat Buildozer va Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0.0" virtualenv buildozer

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # BỔ SUNG BIẾN MÔI TRƯỜNG ĐỂ ÉP BIÊN DỊCH ĐỒNG NHẤT
      - name: Tien hanh Build APK bang Buildozer
        run: |
          yes | buildozer android debug
        env:
          PYTHON: python3
          HOSTPYTHON: python3
