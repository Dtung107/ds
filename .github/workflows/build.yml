name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat phu thuoc he thong
        run: |
          sudo apt update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgdbm-dev libsqlite3-dev tk-dev libb2-dev liblzma-dev libreadline-dev uuid-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython virtualenv

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Tien hanh Build APK bang Buildozer
        run: |
          # Đồng ý tự động với các điều khoản bản quyền của Android SDK nếu hệ thống hỏi
          yes | buildozer android debug

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Quay-So-Moi-Nhat
          path: bin/*.apk
