name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Khởi tạo Python 3.11 riêng biệt (Không ghi đè hệ thống)
      - name: Thiet lap Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cài đặt các gói phụ thuộc bằng Python mặc định của Ubuntu trước
      - name: Cai dat phu thuoc he thong
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev libgdbm-dev libsqlite3-dev tk-dev libb2-dev liblzma-dev libreadline-dev uuid-dev

      # Dùng Python 3.11 để cài đặt Buildozer và các thư viện liên quan
      - name: Cai dat Buildozer va Cython
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install "cython<3.0.0" virtualenv buildozer

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # MẸO QUAN TRỌNG: Tạo liên kết lệnh tạm thời chỉ trong bước này để Buildozer nhận diện đúng
      - name: Tien hanh Build APK bang Buildozer
        run: |
          mkdir -p bz_bin
          ln -s $(which python3.11) bz_bin/python3
          export PATH=$(pwd)/bz_bin:$PATH
          yes | python3.11 -m buildozer android debug

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Quay-So-Moi-Nhat
          path: bin/*.apk
