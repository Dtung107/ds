name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Bien dich file APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SỬA LỖI: Tự động sửa lỗi phân quyền bản quyền SDK và Gradle trên Linux
      - name: Cap quyen thuc thi he thong
        run: |
          chmod +x -R . || true

      # SỬA LỖI: Sắp xếp cấu hình Java tương thích tuyệt đối với Buildozer mới nhất
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Khoi tao Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK voi Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Tai file APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Quay-So-Moi-Nhat
          path: bin/*.apk

