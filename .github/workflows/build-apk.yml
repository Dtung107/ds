name: Build Android APK (Pydroid 3 Web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện web
        run: npm install --legacy-peer-deps

      - name: Build bản web
        run: npm run build

      - name: Đồng bộ sang Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pydroid3-Web.apk

      - name: Tải APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Web-Android-APK
          path: Pydroid3-Web.apk
